<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
--black:#000;--white:#fff;
--g8:#111;--g6:#222;--g4:#555;--g3:#888;--g2:#aaa;--g1:#ccc;
--cold:#a8c5da;--font:'Inter',system-ui,sans-serif;
--ee:cubic-bezier(0.16,1,0.3,1);
}
html,body{width:100%;height:100%;overflow:hidden}
body{
background:var(--black);color:var(--white);
font-family:var(--font);cursor:none;
-webkit-font-smoothing:antialiased;
display:flex;align-items:center;justify-content:center;
}
a{text-decoration:none;color:inherit;cursor:none}
button{border:none;background:none;cursor:none;font-family:inherit;color:inherit}

#cd{
position:fixed;width:8px;height:8px;background:var(--white);
border-radius:50%;pointer-events:none;z-index:9999;
transform:translate(-50%,-50%);mix-blend-mode:difference;will-change:transform;
transition:width .2s,height .2s;
}
#cr{
position:fixed;width:36px;height:36px;
border:1px solid rgba(255,255,255,.5);border-radius:50%;
pointer-events:none;z-index:9998;transform:translate(-50%,-50%);
transition:width .4s var(--ee),height .4s var(--ee),border-color .3s,border-radius .3s;
will-change:transform;
}
body.ch #cr{width:56px;height:56px;border-color:rgba(255,255,255,.8)}
body.cdrag #cr{width:64px;height:64px;border-radius:8px;border-color:rgba(168,197,218,.8)}
body.no-cursor #cd,body.no-cursor #cr{display:none}
body.no-cursor{cursor:auto}
body.no-cursor a,body.no-cursor button{cursor:pointer}

#grain{
position:fixed;inset:-50%;width:200%;height:200%;
pointer-events:none;z-index:990;opacity:.025;
background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
animation:ga .5s steps(1) infinite;
}
@keyframes ga{
0%,100%{transform:translate(0,0)}10%{transform:translate(-2%,-3%)}
20%{transform:translate(3%,2%)}30%{transform:translate(-1%,4%)}
40%{transform:translate(2%,-2%)}50%{transform:translate(-3%,1%)}
60%{transform:translate(1%,3%)}70%{transform:translate(-2%,-1%)}
80%{transform:translate(3%,-3%)}90%{transform:translate(-1%,2%)}
}

#vig{
position:fixed;inset:0;pointer-events:none;z-index:989;
background:radial-gradient(ellipse at center,transparent 25%,rgba(0,0,0,.92) 100%);
}

#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none}

#rippleCanvas{
position:fixed;inset:0;z-index:1;pointer-events:none;
opacity:.6;
}

#preloader{
position:fixed;inset:0;z-index:99999;background:var(--black);
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
}
#pl-n{
font-size:clamp(32px,7vw,72px);font-weight:900;letter-spacing:-.04em;
opacity:0;transform:translateY(24px);
}
#pl-bw{width:160px;height:1px;background:rgba(255,255,255,.1);position:relative;overflow:hidden}
#pl-b{height:100%;width:0;background:var(--white);transition:width .08s linear}
#pl-p{font-size:11px;font-weight:300;letter-spacing:.2em;color:var(--g3)}

.scene{position:relative;z-index:10;perspective:1400px}

.card{
width:min(500px,90vw);
padding:60px 52px 52px;
background:rgba(6,6,6,.96);
border:1px solid rgba(255,255,255,.09);
border-radius:24px;
position:relative;
transform-style:preserve-3d;
will-change:transform;
opacity:0;
}
.card-shine{
position:absolute;inset:0;border-radius:24px;
background:radial-gradient(circle at var(--cx,50%) var(--cy,50%),rgba(255,255,255,.06),transparent 60%);
pointer-events:none;opacity:0;transition:opacity .4s;z-index:1;
}
.card:hover .card-shine{opacity:1}
.card-border{
position:absolute;inset:-1px;border-radius:25px;
background:linear-gradient(135deg,rgba(255,255,255,.15),rgba(255,255,255,.02),rgba(255,255,255,.1));
z-index:-1;
mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
-webkit-mask-composite:xor;mask-composite:exclude;padding:1px;
}
.card-glow{
position:absolute;inset:-60px;border-radius:50px;
background:radial-gradient(ellipse at center,rgba(168,197,218,.05) 0%,transparent 70%);
pointer-events:none;z-index:-2;
animation:gp 5s ease-in-out infinite;
}
@keyframes gp{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}

.card-content{position:relative;z-index:2}

.eyebrow{
font-size:9px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;
color:var(--g4);margin-bottom:28px;
display:flex;align-items:center;gap:10px;
}
.eyebrow::before{content:'';width:20px;height:1px;background:var(--g4)}

.nick{
font-size:clamp(34px,6vw,54px);font-weight:900;letter-spacing:-.04em;line-height:1;
margin-bottom:10px;position:relative;display:inline-block;
}
.nick-accent{color:var(--cold)}

.meta{
font-size:13px;font-weight:300;letter-spacing:.06em;color:var(--g3);
margin-bottom:36px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.meta-dot{width:3px;height:3px;border-radius:50%;background:var(--g4);flex-shrink:0}

.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:36px}
.tag{
padding:5px 12px;
border:1px solid rgba(255,255,255,.08);border-radius:100px;
font-size:10px;font-weight:500;letter-spacing:.08em;color:var(--g3);
transition:border-color .3s,color .3s,transform .3s,background .3s;
cursor:none;
}
.tag:hover{
border-color:rgba(168,197,218,.5);
color:var(--cold);
transform:translateY(-2px);
background:rgba(168,197,218,.06);
}

.divider{
height:1px;
background:linear-gradient(90deg,rgba(255,255,255,.08),rgba(255,255,255,.02),transparent);
margin-bottom:32px;
}

.socials{display:flex;gap:8px;flex-wrap:wrap}
.social{
display:flex;align-items:center;gap:8px;
padding:9px 16px;
border:1px solid rgba(255,255,255,.09);border-radius:100px;
font-size:11px;font-weight:500;letter-spacing:.05em;color:var(--g2);
transition:border-color .3s,color .3s,background .3s,transform .3s,box-shadow .3s;
position:relative;overflow:hidden;
}
.social::after{
content:'';position:absolute;inset:0;
background:rgba(255,255,255,.04);opacity:0;transition:opacity .3s;
}
.social:hover{
border-color:rgba(255,255,255,.3);color:var(--white);
transform:translateY(-3px);
box-shadow:0 8px 20px rgba(0,0,0,.4);
}
.social:hover::after{opacity:1}
.social svg{flex-shrink:0;position:relative;z-index:1}
.social span{position:relative;z-index:1}

.music-pill{
position:absolute;top:18px;right:18px;z-index:10;
display:flex;align-items:center;gap:8px;
padding:7px 14px;
border:1px solid rgba(255,255,255,.09);border-radius:100px;
background:rgba(0,0,0,.6);backdrop-filter:blur(16px);
cursor:none;transition:border-color .3s,background .3s;
}
.music-pill:hover{border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.04)}
.mwaves{display:flex;align-items:center;gap:2px;height:14px}
.mw{
width:2px;border-radius:1px;background:var(--g3);
transition:background .3s;
}
.music-pill:hover .mw{background:var(--white)}
.mw:nth-child(1){animation:mv .9s ease-in-out infinite}
.mw:nth-child(2){animation:mv .9s ease-in-out infinite .18s}
.mw:nth-child(3){animation:mv .9s ease-in-out infinite .36s}
.mw:nth-child(4){animation:mv .9s ease-in-out infinite .54s}
@keyframes mv{0%,100%{height:3px}50%{height:11px}}
.mw.off{animation-play-state:paused!important;height:3px!important}
.mlabel{font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--g3);transition:color .3s;white-space:nowrap}
.music-pill:hover .mlabel{color:var(--white)}

.bar-viz{
display:flex;align-items:flex-end;gap:2px;height:20px;
margin-top:28px;opacity:.4;
}
.bv{
width:3px;border-radius:2px 2px 0 0;background:var(--white);
transition:height .08s ease;
}

.click-hint{
position:absolute;bottom:-32px;left:50%;transform:translateX(-50%);
font-size:9px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;
color:var(--g4);white-space:nowrap;opacity:0;
animation:hintFade 3s ease 2s forwards;
}
@keyframes hintFade{0%{opacity:0;transform:translateX(-50%) translateY(4px)}30%{opacity:1;transform:translateX(-50%) translateY(0)}70%{opacity:1}100%{opacity:0}}

.ripple-fx{
position:absolute;border-radius:50%;
border:1px solid rgba(255,255,255,.3);
pointer-events:none;z-index:100;
transform:translate(-50%,-50%) scale(0);
animation:rippleFx .7s ease-out forwards;
}
@keyframes rippleFx{to{transform:translate(-50%,-50%) scale(4);opacity:0}}

@media(max-width:520px){
.card{padding:44px 28px 36px}
.nick{font-size:clamp(28px,8vw,42px)}
.socials{gap:7px}
.social{padding:8px 12px;font-size:10px}
.tags{gap:5px}
.tag{font-size:9px;padding:4px 10px}
}
@media(prefers-reduced-motion:reduce){
*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
#grain{animation:none}
}
</style>

<script>
(function(){
'use strict';

const isTouch='ontouchstart' in window;
const isMobile=innerWidth<520;
const prefRM=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
const $=id=>document.getElementById(id);

let mx=innerWidth/2,my=innerHeight/2,dx=mx,dy=my,rx=mx,ry=my;

if(!isTouch&&!isMobile){
  document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY},{passive:true});
  (function cur(){
    dx+=(mx-dx)*.88;dy+=(my-dy)*.88;
    rx+=(mx-rx)*.1;ry+=(my-ry)*.1;
    $('cd').style.left=dx+'px';$('cd').style.top=dy+'px';
    $('cr').style.left=rx+'px';$('cr').style.top=ry+'px';
    requestAnimationFrame(cur);
  })();
  document.querySelectorAll('a,button,.tag').forEach(el=>{
    el.addEventListener('mouseenter',()=>document.body.classList.add('ch'));
    el.addEventListener('mouseleave',()=>document.body.classList.remove('ch'));
  });
  $('card').addEventListener('mousedown',()=>document.body.classList.add('cdrag'));
  document.addEventListener('mouseup',()=>document.body.classList.remove('cdrag'));
}else{
  document.body.classList.add('no-cursor');
}

const bgC=$('bgCanvas'),bgX=bgC.getContext('2d');
const rC=$('rippleCanvas'),rX=rC.getContext('2d');
let bw,bh,pts=[],ripples=[];

function resize(){
  bw=bgC.width=rC.width=innerWidth;
  bh=bgC.height=rC.height=innerHeight;
}
resize();
window.addEventListener('resize',()=>{resize();buildPts()},{passive:true});

const COLORS=['rgba(168,197,218,','rgba(255,255,255,','rgba(120,140,200,'];

function buildPts(){
  const n=isMobile?30:70;
  pts=[];
  for(let i=0;i<n;i++){
    const c=COLORS[Math.floor(Math.random()*COLORS.length)];
    pts.push({
      x:Math.random()*bw,y:Math.random()*bh,
      vx:(Math.random()-.5)*.22,vy:(Math.random()-.5)*.22,
      r:Math.random()*1.4+.4,a:Math.random()*.3+.06,
      color:c,pulse:Math.random()*Math.PI*2,
      pulseSpeed:Math.random()*.02+.01
    });
  }
}
buildPts();

let bgT=0;
function drawBg(){
  bgX.clearRect(0,0,bw,bh);

  const grd=bgX.createRadialGradient(bw*.5,bh*.5,0,bw*.5,bh*.5,bw*.7);
  grd.addColorStop(0,'rgba(10,10,18,.95)');
  grd.addColorStop(.5,'rgba(4,4,10,.98)');
  grd.addColorStop(1,'rgba(0,0,0,1)');
  bgX.fillStyle=grd;
  bgX.fillRect(0,0,bw,bh);

  bgT+=.003;
  const numLines=6;
  for(let i=0;i<numLines;i++){
    const angle=bgT+i*(Math.PI/numLines);
    const len=Math.max(bw,bh)*.8;
    const cx=bw/2,cy=bh/2;
    const x1=cx+Math.cos(angle)*len;
    const y1=cy+Math.sin(angle)*len;
    const x2=cx+Math.cos(angle+Math.PI)*len;
    const y2=cy+Math.sin(angle+Math.PI)*len;
    const lg=bgX.createLinearGradient(x1,y1,x2,y2);
    lg.addColorStop(0,'rgba(168,197,218,0)');
    lg.addColorStop(.5,`rgba(168,197,218,${.018+Math.sin(bgT*2+i)*.008})`);
    lg.addColorStop(1,'rgba(168,197,218,0)');
    bgX.beginPath();
    bgX.moveTo(x1,y1);bgX.lineTo(x2,y2);
    bgX.strokeStyle=lg;bgX.lineWidth=1;bgX.stroke();
  }

  const linkD=isMobile?70:110;
  for(let i=0;i<pts.length;i++){
    const p=pts[i];
    p.x+=p.vx;p.y+=p.vy;
    p.pulse+=p.pulseSpeed;
    if(p.x<0||p.x>bw)p.vx*=-1;
    if(p.y<0||p.y>bh)p.vy*=-1;
    const pa=p.a*(0.7+Math.sin(p.pulse)*0.3);

    if(!isMobile){
      for(let j=i+1;j<pts.length;j++){
        const q=pts[j];
        const ex=p.x-q.x,ey=p.y-q.y,d=Math.sqrt(ex*ex+ey*ey);
        if(d<linkD){
          const alpha=(1-d/linkD)*.07;
          bgX.beginPath();bgX.moveTo(p.x,p.y);bgX.lineTo(q.x,q.y);
          bgX.strokeStyle=`rgba(255,255,255,${alpha})`;
          bgX.lineWidth=.6;bgX.stroke();
        }
      }
    }

    bgX.beginPath();
    bgX.arc(p.x,p.y,p.r,0,Math.PI*2);
    bgX.fillStyle=p.color+pa+')';
    bgX.fill();
  }

  rX.clearRect(0,0,bw,bh);
  for(let i=ripples.length-1;i>=0;i--){
    const r=ripples[i];
    r.radius+=r.speed;
    r.alpha-=r.decay;
    if(r.alpha<=0){ripples.splice(i,1);continue;}
    rX.beginPath();
    rX.arc(r.x,r.y,r.radius,0,Math.PI*2);
    rX.strokeStyle=`rgba(168,197,218,${r.alpha})`;
    rX.lineWidth=1;rX.stroke();
  }

  requestAnimationFrame(drawBg);
}
drawBg();

function spawnRipple(x,y,fast){
  const n=fast?3:1;
  for(let i=0;i<n;i++){
    ripples.push({
      x,y,
      radius:fast?i*18:0,
      speed:fast?3.5:2.5,
      alpha:fast?.5:.4,
      decay:fast?.012:.008
    });
  }
}

document.addEventListener('click',e=>{
  if(!e.target.closest('.card'))spawnRipple(e.clientX,e.clientY,false);
},{passive:true});

document.addEventListener('mousemove',e=>{
  if(Math.random()<.04&&!e.target.closest('.card')){
    ripples.push({x:e.clientX,y:e.clientY,radius:0,speed:1.2,alpha:.15,decay:.012});
  }
},{passive:true});

const card=$('card'),shine=$('cardShine');
let cRX=0,cRY=0,cTX=0,cTY=0,isDrag=false,dsX=0,dsY=0,drX=0,drY=0;
let springTimer;

function springBack(){
  clearInterval(springTimer);
  const sx=cTX,sy=cTY;let t=0;
  function sp(){
    t+=.04;
    const d=Math.exp(-t*4)*Math.cos(t*9);
    cTX=sx*d;cTY=sy*d;
    if(Math.abs(d)>.003)requestAnimationFrame(sp);
    else{cTX=0;cTY=0;}
  }
  sp();
}

if(!isTouch){
  card.addEventListener('mousemove',e=>{
    if(isDrag)return;
    const r=card.getBoundingClientRect();
    cTX=-(e.clientY-(r.top+r.height/2))/r.height*20;
    cTY=(e.clientX-(r.left+r.width/2))/r.width*20;
    const px=((e.clientX-r.left)/r.width*100).toFixed(1)+'%';
    const py=((e.clientY-r.top)/r.height*100).toFixed(1)+'%';
    shine.style.setProperty('--cx',px);
    shine.style.setProperty('--cy',py);
    shine.style.setProperty('background',`radial-gradient(circle at ${px} ${py},rgba(255,255,255,.07),transparent 60%)`);
  });
  card.addEventListener('mouseleave',()=>{if(!isDrag)springBack();});
  card.addEventListener('mousedown',e=>{
    isDrag=true;dsX=e.clientX;dsY=e.clientY;drX=cRX;drY=cRY;
    e.preventDefault();
  });
  document.addEventListener('mousemove',e=>{
    if(!isDrag)return;
    cTX=drX-(e.clientY-dsY)*.32;
    cTY=drY+(e.clientX-dsX)*.32;
  },{passive:true});
  document.addEventListener('mouseup',()=>{if(!isDrag)return;isDrag=false;springBack();});
}else{
  let tx=0,ty=0,rx2=0,ry2=0;
  card.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;rx2=cRX;ry2=cRY;},{passive:true});
  card.addEventListener('touchmove',e=>{cTX=rx2-(e.touches[0].clientY-ty)*.2;cTY=ry2+(e.touches[0].clientX-tx)*.2;},{passive:true});
  card.addEventListener('touchend',springBack);
}

(function animCard(){
  cRX+=(cTX-cRX)*.08;cRY+=(cTY-cRY)*.08;
  const M=22,fx=Math.max(-M,Math.min(M,cRX)),fy=Math.max(-M,Math.min(M,cRY));
  card.style.transform=`rotateX(${fx}deg) rotateY(${fy}deg)`;
  requestAnimationFrame(animCard);
})();

card.addEventListener('click',e=>{
  const r=card.getBoundingClientRect();
  const rp=document.createElement('div');
  rp.className='ripple-fx';
  rp.style.left=(e.clientX-r.left)+'px';
  rp.style.top=(e.clientY-r.top)+'px';
  rp.style.width='40px';rp.style.height='40px';
  card.appendChild(rp);
  setTimeout(()=>rp.remove(),700);
});

document.querySelectorAll('.tag').forEach(tag=>{
  tag.addEventListener('click',()=>{
    gsap.to(tag,{scale:1.15,duration:.12,ease:'power2.out',yoyo:true,repeat:1});
    const r=tag.getBoundingClientRect();
    spawnRipple(r.left+r.width/2,r.top+r.height/2,true);
  });
});

const audio=$('bgMusic');
const mws=[$('mw1'),$('mw2'),$('mw3'),$('mw4')];
const mlabel=$('mlabel'),musicBtn=$('musicBtn');
let playing=false;

audio.volume=0;

function fadeVol(to,dur){
  const from=audio.volume,steps=60,dt=dur/steps;
  let i=0;
  const t=setInterval(()=>{
    i++;audio.volume=Math.max(0,Math.min(1,from+(to-from)*(i/steps)));
    if(i>=steps)clearInterval(t);
  },dt);
}

function setWaves(on){
  mws.forEach(w=>on?w.classList.remove('off'):w.classList.add('off'));
}

musicBtn.addEventListener('click',()=>{
  if(!playing){
    audio.play().then(()=>{
      playing=true;
      setWaves(true);
      mlabel.textContent='Играет';
      fadeVol(.55,1500);
    }).catch(()=>{});
  }else{
    fadeVol(0,600);
    setTimeout(()=>{audio.pause();playing=false;setWaves(false);mlabel.textContent='Пауза';},650);
  }
});

let plPct=0;
const plB=$('pl-b'),plP=$('pl-p'),plN=$('pl-n');

if(!prefRM){
  gsap.to(plN,{opacity:1,y:0,duration:.7,ease:'power3.out',delay:.15});
}else{
  plN.style.opacity='1';plN.style.transform='none';
}

const plInt=setInterval(()=>{
  plPct+=Math.random()*14+6;
  if(plPct>=100){plPct=100;clearInterval(plInt);setTimeout(hideLoader,320);}
  plB.style.width=Math.min(plPct,100)+'%';
  plP.textContent=Math.floor(Math.min(plPct,100))+'%';
},75);

function hideLoader(){
  gsap.timeline()
    .to(plN,{y:-28,opacity:0,duration:.35,ease:'power2.in'})
    .to($('pl-bw'),{opacity:0,duration:.25},'-=.15')
    .to($('preloader'),{yPercent:-100,duration:.75,ease:'power3.inOut',
      onComplete:()=>{
        $('preloader').style.display='none';
        gsap.to(card,{opacity:1,duration:.7,ease:'power2.out',
          onComplete:()=>{
            audio.play().then(()=>{
              playing=true;setWaves(true);mlabel.textContent='Играет';fadeVol(.55,2000);
            }).catch(()=>{});
          }
        });
        gsap.fromTo('.eyebrow',{opacity:0,y:10},{opacity:1,y:0,duration:.6,delay:.2});
        gsap.fromTo('#nick',{opacity:0,y:16},{opacity:1,y:0,duration:.7,delay:.35,ease:'power3.out'});
        gsap.fromTo('.meta',{opacity:0,y:10},{opacity:1,y:0,duration:.6,delay:.5});
        gsap.fromTo('.tag',{opacity:0,y:12},{opacity:1,y:0,duration:.5,stagger:.06,delay:.6,ease:'power2.out'});
        gsap.fromTo('.divider',{scaleX:0},{scaleX:1,duration:.8,delay:.9,ease:'power3.out',transformOrigin:'left'});
        gsap.fromTo('.social',{opacity:0,y:10},{opacity:1,y:0,duration:.5,stagger:.07,delay:1,ease:'power2.out'});
      }
    });
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'&&e.target===document.body){
    e.preventDefault();
    musicBtn.click();
  }
});

})();
</script>
